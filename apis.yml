aid: soundcommerce
name: SoundCommerce
description: 'SoundCommerce is the retail-data company whose platform is now Reactor (reactordata.com),
  an intelligent data platform for modern commerce brands. Reactor connects 100+ commerce, marketing,
  ads, support, and fulfillment systems to cloud warehouses (Snowflake, BigQuery, Databricks, AWS,
  Apache Iceberg) and AI vector stores, preserving every raw record immutably for replay, resolving
  shared entity identity at ingest, and shipping versioned, governed data products directly into the
  customer''s own warehouse. It exposes those governed data products to Claude and other MCP-compatible
  AI agents through the Reactor MCP connector, and includes Electron AI, an agentic teammate that
  writes mappings and suggests joins. Founded 2023 out of SoundCommerce; acquired by Stelao in 2026.'
